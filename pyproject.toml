[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "product-intel-agent"
version = "0.1.0"
description = "Local product-intel weekly report pipeline."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "httpx>=0.27",
  "beautifulsoup4>=4.12",
  "curl-cffi>=0.7",
  "openpyxl>=3.1",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "jinja2>=3.1",
  "openai>=1.40",
]

[project.optional-dependencies]
browser = [
  "playwright>=1.45",
]
dev = [
  "pytest>=8.2",
  "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["app", "data"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]

[tool.ruff.format]
quote-style = "double"
